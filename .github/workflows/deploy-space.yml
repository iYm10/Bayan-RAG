name: Publish Gradio Space

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: huggingface-space
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment credential
        id: credential
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment skipped. Add HF_TOKEN as a repository secret after creating an eligible free Gradio Space."
          fi
      - uses: actions/checkout@v4
        if: steps.credential.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        if: steps.credential.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: Install publishing client
        if: steps.credential.outputs.ready == 'true'
        run: python -m pip install 'huggingface-hub>=1,<2'
      - name: Upload to existing Space
        if: steps.credential.outputs.ready == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: yahya-ai10/Bayan-RAG
        run: python scripts/publish_space.py
