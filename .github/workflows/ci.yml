name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install '.[dev]'
      - run: ruff check app tests scripts
      - run: ruff format --check app tests scripts
      - run: python -m unittest discover -s tests -v
      - run: python scripts/evaluate.py /tmp/evaluation-results.json
      - name: Verify committed offline reference report
        run: diff docs/evaluation-results.json /tmp/evaluation-results.json
      - run: node --check app/static/app.js

  browser:
    name: Browser workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - name: Exercise the workspace
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/bayan-server.log 2>&1 &
          python - <<'PY'
          import time
          import urllib.request
          for attempt in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Server did not become ready')
          PY
          python scripts/browser_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-screenshots
          path: assets/*.png
